# Config for the City environment.
# TODO: every value below is a PLACEHOLDER — none of it has been verified
# against the actual City map yet. Fill these in using the checks discussed:
#   1. Run list_scene_objects.py against City to get real mesh names for
#      segmentation_classes below.
#   2. Pick a candidate start/goal pair, verify it's flyable and
#      collision-free with hardcoded_flight_test.py before trusting it.
#   3. Set workspace_bounds to match City's actual scale (it's a much
#      bigger map than Blocks — these Blocks-sized bounds are almost
#      certainly wrong here).
# Do not train against this file until the TODOs are resolved.

env_name: city

start_position: [0, 0, -5]   # TODO: verify — placeholder, not confirmed flyable
goal_position: [50, 0, -5]   # TODO: verify — placeholder, not confirmed flyable

workspace_bounds:
  x: [-250, 250]   # TODO: verify against actual City map extents
  y: [-250, 250]   # TODO: verify against actual City map extents
  z: [-100, 0]     # TODO: verify — City likely has taller structures than Blocks

start_jitter_radius: 1.0    # TODO: reconsider scale for City
goal_jitter_radius: 3.0     # TODO: reconsider scale for City

max_depth_meters: 20.0      # TODO: City likely has longer sightlines (streets) than Blocks
accept_radius: 1.0         # TODO: consider making this smaller for City, which has more open space
